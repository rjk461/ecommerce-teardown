    <style>
    /* ============================================================
       PERSONAL BRAND REFRESH — Richard Kelsey / Ecommerce Teardown
       ============================================================ */
    :root {
      --green: #00C853;
      --green-dim: rgba(0, 200, 83, 0.12);
      --green-border: rgba(0, 200, 83, 0.25);
      --dark: #0D1117;
      --dark-2: #161B22;
      --dark-3: #21262D;
      --text: #E6EDF3;
      --muted: #A8B3BD;
      --border: #30363D;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 18px;
      margin: 0;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* ── CONTACT PAGE ─────────────────────────────────────────── */
    .contact-hero {
      padding: 2rem 0 2.5rem;
      border-bottom: 1px solid var(--border);
    }

    .contact-hero .section-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 0.5rem;
    }

    .contact-hero h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0;
      color: var(--text);
    }

    .contact-section {
      padding: 3rem 0 5rem;
    }

    .contact-form-wrap {
      max-width: 560px;
      margin: 0 auto;
    }

    .form-card {
      background: var(--dark-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
    }

    .form-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 1.75rem;
      color: var(--text);
    }

    .form-group { margin-bottom: 1.25rem; }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--dark-3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      font-size: 0.9rem;
      color: var(--text);
      font-family: inherit;
      transition: border-color 0.2s;
      outline: none;
      box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group textarea:focus { border-color: var(--green); }

    .form-group input::placeholder,
    .form-group textarea::placeholder { color: var(--muted); }

    .submit-btn {
      width: 100%;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
      font-family: inherit;
      letter-spacing: -0.01em;
      margin-top: 0.25rem;
    }

    .submit-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .success-msg {
      text-align: center;
      padding: 2rem 0;
    }

    .success-msg .check { font-size: 2rem; color: var(--green); margin-bottom: 0.75rem; }
    .success-msg h3 { font-size: 1.2rem; font-weight: 700; color: var(--green); margin: 0 0 0.5rem; }
    .success-msg p { font-size: 0.875rem; color: var(--muted); margin: 0; line-height: 1.6; }

    @media (max-width: 640px) {
      body { font-size: 20px; }
    }
    </style>

<body>
    <!-- HEADER -->

<main>

        <!-- HERO -->
        <section class="contact-hero">
            <div class="container">
                <div class="section-label">Get in Touch</div>
                <h1>Let's Talk Ecommerce</h1>
            </div>
        </section>

        <!-- CONTACT FORM -->
        <section class="contact-section">
            <div class="container">
                <div class="contact-form-wrap">
                    <div class="form-card">
                        <h2>Send a message</h2>
                        <form id="contactForm" action="https://formspree.io/f/meoykkey" method="POST">
                            <input type="hidden" name="_to" value="richardkelsey@gmail.com">

                            <div class="form-group">
                                <label for="name">Name *</label>
                                <input type="text" id="name" name="name" placeholder="Your name" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" name="email" placeholder="your@email.com" required>
                            </div>
                            <div class="form-group">
                                <label for="subject">Subject *</label>
                                <input type="text" id="subject" name="subject" placeholder="What's this about?" required>
                            </div>
                            <div class="form-group">
                                <label for="message">Message *</label>
                                <textarea id="message" name="message" rows="6" placeholder="Tell me what's on your mind..." required></textarea>
                            </div>

                            <button type="submit" class="submit-btn" id="submitBtn">Send Message &rarr;</button>
                        </form>
                        <div class="success-msg" id="successMsg" style="display:none;">
                            <div class="check">&#10003;</div>
                            <h3>Message sent</h3>
                            <p>Thanks for reaching out. I'll get back to you as soon as possible.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- FOOTER -->

<script>
        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMsg = document.getElementById('successMsg');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;

            try {
                const formData = new FormData(form);
                const subject = formData.get('subject');
                if (subject) formData.set('_subject', 'Contact: ' + subject);

                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    form.style.display = 'none';
                    successMsg.style.display = 'block';
                } else {
                    throw new Error('failed');
                }
            } catch (error) {
                submitBtn.textContent = 'Send Message \u2192';
                submitBtn.disabled = false;
                alert('Something went wrong. Please try again.');
            }
        });
    </script>

    <script>
      var btn = document.getElementById('hamburger');
      var menu = document.getElementById('mobile-menu');
      btn.addEventListener('click', function() {
        btn.classList.toggle('open');
        menu.classList.toggle('open');
      });
      menu.querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', function() {
          btn.classList.remove('open');
          menu.classList.remove('open');
        });
      });
    </script>
</body>
