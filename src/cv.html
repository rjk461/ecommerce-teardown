<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV — Richard Kelsey | Ecommerce Teardown</title>
    <meta name="description" content="Richard Kelsey's resume — Head of Ecommerce, 16+ years building Australian ecommerce, Beer Cartel exit.">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="stylesheet" href="/site.css?v=3">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ecommerceteardown.com/cv">
    <meta property="og:title" content="CV — Richard Kelsey | Ecommerce Teardown">
    <meta property="og:description" content="Head of Ecommerce — resume and experience overview.">
    <meta property="og:image" content="https://ecommerceteardown.com/images/og-image.png">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QS74BWRKTY"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QS74BWRKTY');
    </script>

    <!-- Reddit Pixel -->
    <script src="/reddit-pixel.js"></script>

    <style>
    :root {
      --green: #00C853;
      --green-dim: rgba(0, 200, 83, 0.12);
      --green-border: rgba(0, 200, 83, 0.25);
      --dark: #0D1117;
      --dark-2: #161B22;
      --dark-3: #21262D;
      --text: #E6EDF3;
      --muted: #A8B3BD;
      --border: #30363D;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 18px;
      margin: 0;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    @media (max-width: 768px) {
      .nav-hide-mobile { display: none; }
    }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 1.25rem 0 2rem;
      border-bottom: 1px solid var(--border);
    }

    .page-header-inner {
      max-width: 760px;
    }

    .page-eyebrow {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 0.75rem;
    }

    .page-header h1 {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 1rem;
      line-height: 1.15;
    }

    .page-header p {
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 600px;
      margin: 0 0 1.5rem;
    }

    .cv-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      padding: 0.65rem 1.25rem;
      font-size: 0.95rem;
      transition: opacity 0.2s, transform 0.2s;
    }

    .btn:hover { opacity: 0.88; transform: translateY(-1px); }

    .btn-primary {
      background: var(--green);
      color: #000;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { border-color: var(--green); }

    /* ── CV EMBED ── */
    .cv-section {
      padding: 2rem 0 4rem;
    }

    .cv-card {
      background: var(--dark-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    /* 75% of one A4 portrait page height at full width (same as 210/(297×0.75) ⇒ 280/297) */
    .cv-iframe-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 280 / 297;
      min-height: 390px;
    }

    .cv-iframe-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .cv-fallback-note {
      display: none;
      padding: 1rem 1.25rem;
      font-size: 0.9rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      body { font-size: 20px; }
      .cv-iframe-wrap { min-height: 315px; }
      .cv-fallback-note { display: block; }
    }
    </style>
</head>
<body>

    <!-- HEADER -->

<main>
        <section class="page-header">
            <div class="container">
                <div class="page-header-inner">
                    <div class="page-eyebrow">Resume</div>
                    <h1>Richard Kelsey CV</h1>
                    <p>Head of Ecommerce and marketing leadership — 16 years scaling Australian ecommerce. View below or download the PDF.</p>
                    <div class="cv-actions">
                        <a href="/Sample/Richard-Kelsey-CV.pdf" class="btn btn-primary" download>Download PDF</a>
                        <a href="/Sample/Richard-Kelsey-CV.pdf" class="btn btn-secondary" target="_blank" rel="noopener">Open in new tab</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="cv-section">
            <div class="container">
                <div class="cv-card">
                    <div class="cv-iframe-wrap">
                        <iframe
                            title="Richard Kelsey CV"
                            src="/Sample/Richard-Kelsey-CV.pdf#view=FitH"
                            loading="lazy"></iframe>
                    </div>
                    <p class="cv-fallback-note">On mobile, the preview may be limited. Use <strong>Download PDF</strong> or <strong>Open in new tab</strong> above for the full layout.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->

<script>
      var btn = document.getElementById('hamburger');
      var menu = document.getElementById('mobile-menu');
      btn.addEventListener('click', function() {
        btn.classList.toggle('open');
        menu.classList.toggle('open');
      });
      menu.querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', function() {
          btn.classList.remove('open');
          menu.classList.remove('open');
        });
      });
    </script>
</body>
</html>
